name: CI - تست و بررسی

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: تست روی Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || echo "⚠️ requirements-dev.txt موجود نیست"

      - name: 📥 دانلود دیتاهای NLTK
        run: |
          python -m nltk.downloader punkt wordnet cmudict

      - name: 🔍 بررسی وجود فایل‌های ضروری
        run: |
          echo "📁 بررسی فایل‌ها..."
          ls -la
          echo "📄 بررسی Book1.xlsx..."
          if [ -f "Book1.xlsx" ]; then
            echo "✅ Book1.xlsx وجود دارد."
          else
            echo "❌ Book1.xlsx وجود ندارد! لطفاً آن را به مخزن اضافه کنید."
            exit 1
          fi
          echo "📂 بررسی src/__init__.py..."
          if [ -f "src/__init__.py" ]; then
            echo "✅ src/__init__.py وجود دارد."
          else
            echo "❌ src/__init__.py وجود ندارد!"
            exit 1
          fi

      - name: 🔍 بررسی استایل با flake8 (فقط هشدار، بدون شکست)
        run: |
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: 🧪 اجرای تست‌های واحد (در صورت وجود)
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v
          else
            echo "⚠️ تست‌های واحدی یافت نشد، رد می‌شود."
          fi
        continue-on-error: true

      - name: 🏃 اجرای اصلی برنامه (Smoke Test)
        run: |
          # ساخت فایل نمونه
          mkdir -p data/input data/output
          echo "This is a CI test. It has two sentences. Hello world!" > data/input/ci_test.txt
          
          # اجرا
          python src/main.py data/input/ci_test.txt
          
          # بررسی خروجی
          if [ -f "data/output/output.xlsx" ]; then
            echo "✅ خروجی اکسل ساخته شد."
          else
            echo "❌ خروجی اکسل ساخته نشد!"
            exit 1
          fi
          
          if [ -f "data/output/output.txt" ]; then
            echo "✅ خروجی متنی ساخته شد."
          else
            echo "❌ خروجی متنی ساخته نشد!"
            exit 1
          fi

  # Job داکر (اختیاری)
  docker-test:
    name: تست داکر
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: ساخت ایمیج
        run: docker build -f docker/Dockerfile -t text-processor .
      - name: اجرا با داکر
        run: |
          mkdir -p data/input data/output
          echo "Docker CI test" > data/input/docker_test.txt
          docker run --rm -v "$(pwd)/data:/app/data" -v "$(pwd)/Book1.xlsx:/app/Book1.xlsx" text-processor data/input/docker_test.txt
          test -f data/output/output.xlsx && echo "✅ داکر موفق بود."
