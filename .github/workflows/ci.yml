name: CI - تست و بررسی

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# دسترسی نوشتن به actions برای حذف Artifactهای قبلی
permissions:
  actions: write
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: تست روی Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || echo "⚠️ requirements-dev.txt موجود نیست"

      - name: 📥 دانلود دیتاهای NLTK
        run: |
          python -m nltk.downloader punkt wordnet cmudict

      - name: 🔍 بررسی وجود فایل‌های ضروری
        run: |
          echo "📁 بررسی فایل‌ها..."
          ls -la
          echo "📄 بررسی Book1.xlsx..."
          if [ -f "Book1.xlsx" ]; then
            echo "✅ Book1.xlsx وجود دارد."
          else
            echo "❌ Book1.xlsx وجود ندارد! لطفاً آن را به مخزن اضافه کنید."
            exit 1
          fi
          echo "📂 بررسی src/__init__.py..."
          if [ -f "src/__init__.py" ]; then
            echo "✅ src/__init__.py وجود دارد."
          else
            echo "❌ src/__init__.py وجود ندارد!"
            exit 1
          fi

      - name: 🔍 بررسی استایل با flake8 (فقط هشدار، بدون شکست)
        run: |
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: 🧪 اجرای تست‌های واحد (در صورت وجود)
        env:
          PYTHONPATH: .
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v
          else
            echo "⚠️ تست‌های واحدی یافت نشد، رد می‌شود."
          fi
        continue-on-error: true

      - name: 🏃 اجرای اصلی برنامه (Smoke Test)
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data/input data/output
          echo "This is a CI test. It has two sentences. Hello world!" > data/input/ci_test.txt
          
          python src/main.py data/input/ci_test.txt
          
          if [ -f "data/output/output.xlsx" ]; then
            echo "✅ خروجی اکسل ساخته شد."
          else
            echo "❌ خروجی اکسل ساخته نشد!"
            exit 1
          fi
          
          if [ -f "data/output/output.txt" ]; then
            echo "✅ خروجی متنی ساخته شد."
          else
            echo "❌ خروجی متنی ساخته نشد!"
            exit 1
          fi

      # ============================================================
      # 🗑️ حذف آرتیفکت‌های قبلی output-python (فقط یک بار روی 3.10)
      # ============================================================
      - name: 🗑️ حذف آرتیفکت‌های قبلی پایتون
        if: matrix.python-version == '3.10'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'output-python';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === artifactName) {
                console.log(`🗑️ حذف آرتیفکت قدیمی: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: 📤 آپلود خروجی پایتون (فقط Python 3.10)
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: output-python
          path: |
            data/output/output.xlsx
            data/output/output.txt
          retention-days: 7
          if-no-files-found: warn

  docker-test:
    name: تست داکر
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4
      
      - name: ساخت ایمیج
        run: docker build -f docker/Dockerfile -t text-processor .
      
      - name: اجرا با داکر (ورودی یکسان با پایتون)
        run: |
          mkdir -p data/input data/output
          echo "This is a CI test. It has two sentences. Hello world!" > data/input/ci_test.txt
          docker run --rm \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/Book1.xlsx:/app/Book1.xlsx" \
            text-processor data/input/ci_test.txt
          
          if [ -f "data/output/output.xlsx" ]; then
            echo "✅ داکر موفق بود - خروجی اکسل ساخته شد."
          else
            echo "❌ خروجی اکسل ساخته نشد!"
            exit 1
          fi

      # ============================================================
      # 🗑️ حذف آرتیفکت‌های قبلی output-docker
      # ============================================================
      - name: 🗑️ حذف آرتیفکت‌های قبلی داکر
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'output-docker';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === artifactName) {
                console.log(`🗑️ حذف آرتیفکت قدیمی: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: 📤 آپلود خروجی داکر
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-docker
          path: |
            data/output/output.xlsx
            data/output/output.txt
          retention-days: 7
          if-no-files-found: warn
