name: CI - تست و بررسی کد

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: تست روی Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 نصب Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 نصب کتابخانه‌های مورد نیاز
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || echo "⚠️ requirements-dev.txt پیدا نشد، فقط کتابخانه‌های اصلی نصب شدند."

      - name: 📥 دانلود دیتاهای NLTK
        run: |
          python -m nltk.downloader punkt wordnet cmudict

      - name: 🔍 بررسی استایل کد (فقط هشدار، عدم شکست)
        run: |
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true   # ← این باعث می‌شود حتی با خطا هم ادامه دهد

      - name: 🧪 اجرای تست‌های واحد (در صورت وجود)
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --cov=src/ --cov-report=term-missing
          else
            echo "⚠️ تست‌های واحدی یافت نشد، مرحله رد شد."
          fi
        continue-on-error: true   # ← اگر تست fail شود، کل Workflow متوقف نمی‌شود

      - name: 🏃 تست اجرای برنامه (Smoke Test)
        run: |
          # اطمینان از وجود Book1.xlsx
          if [ ! -f "Book1.xlsx" ]; then
            echo "⚠️ فایل Book1.xlsx وجود ندارد! یک فایل خالی جایگزین می‌شود."
            echo "این یک فایل موقت برای تست است" > Book1.xlsx
          fi
          
          # اطمینان از وجود پوشه‌های ورودی/خروجی
          mkdir -p data/input data/output
          
          # یک فایل نمونه برای تست بساز
          echo "This is a sample text for CI testing. It has two sentences." > data/input/test_sample.txt
          
          # اجرای برنامه
          python src/main.py data/input/test_sample.txt
          
          # بررسی اینکه خروجی ساخته شده
          if [ -f "data/output/output.xlsx" ]; then
            echo "✅ خروجی اکسل ساخته شد."
          else
            echo "❌ خروجی اکسل ساخته نشد!"
            exit 1
          fi
          
          if [ -f "data/output/output.txt" ]; then
            echo "✅ خروجی متنی ساخته شد."
          else
            echo "❌ خروجی متنی ساخته نشد!"
            exit 1
          fi

  # ------------------------------------------------------------
  # Job جداگانه برای داکر (مستقل از تست پایتون)
  # ------------------------------------------------------------
  docker-build:
    name: ساخت و تست ایمیج داکر
    runs-on: ubuntu-latest
    needs: test   # بعد از موفقیت Job قبلی اجرا شود
    if: success() # فقط اگر تست‌های پایتون موفق بودند
    
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐳 نصب و تنظیم داکر
        uses: docker/setup-buildx-action@v3

      - name: 📦 ساخت ایمیج داکر
        run: |
          docker build -f docker/Dockerfile -t text-processor .

      - name: 🧪 تست اجرا با داکر
        run: |
          mkdir -p data/input data/output
          echo "Docker test text. Hello from container!" > data/input/docker_test.txt
          
          # اگر Book1.xlsx وجود ندارد، یک فایل خالی بساز
          if [ ! -f "Book1.xlsx" ]; then
            echo "⚠️ فایل Book1.xlsx وجود ندارد! یک فایل خالی جایگزین می‌شود."
            echo "این یک فایل موقت برای تست است" > Book1.xlsx
          fi
          
          docker run --rm \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/Book1.xlsx:/app/Book1.xlsx" \
            text-processor data/input/docker_test.txt
          
          if [ -f "data/output/output.xlsx" ]; then
            echo "✅ خروجی داکر ساخته شد."
          else
            echo "❌ خروجی داکر ساخته نشد!"
            exit 1
          fi
