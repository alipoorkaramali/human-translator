name: CI - تست و بررسی

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'data/input/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Book1.xlsx'
      - 'requirements*.txt'
      - 'setup.py'
      - 'docker/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/input/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Book1.xlsx'
      - 'requirements*.txt'
      - 'setup.py'
      - 'docker/**'

jobs:
  test:
    name: تست روی Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "⚠️ requirements-dev.txt موجود نیست"
          fi

      - name: 📥 دانلود دیتاهای NLTK
        run: |
          if [ -f scripts/download_nltk.py ]; then
            python scripts/download_nltk.py
          else
            python -m nltk.downloader punkt wordnet cmudict omw-1.4
          fi

      # ============================================================
      # 🔍 بررسی فایل‌ها و پوشه‌های ضروری (هماهنگ با ساختار فعلی پروژه)
      # ============================================================
      - name: 🔍 بررسی فایل‌های ضروری
        run: |
          set -e
          errors=0

          check_file() {
            if [ ! -f "$1" ]; then
              echo "❌ فایل ضروری وجود ندارد: $1"
              errors=$((errors+1))
            else
              echo "✅ $1"
            fi
          }
          check_dir() {
            if [ ! -d "$1" ]; then
              echo "❌ پوشه ضروری وجود ندارد: $1"
              errors=$((errors+1))
            else
              echo "✅ $1/"
            fi
          }
          check_optional() {
            if [ -f "$1" ]; then
              echo "✅ (اختیاری) $1"
            else
              echo "⚠️  (اختیاری، هنوز ساخته نشده) $1"
            fi
          }

          echo "──── ریشه ────"
          check_file "Book1.xlsx"
          check_file "setup.py"
          check_file "requirements.txt"

          echo "──── src ────"
          check_file "src/__init__.py"
          check_file "src/main.py"
          check_file "src/utils.py"
          check_file "src/ht_token.py"

          echo "──── core ────"
          check_dir  "src/core"
          check_file "src/core/context.py"
          check_file "src/core/rule_base.py"
          check_file "src/core/processor.py"
          check_file "src/core/pipeline.py"

          echo "──── importers ────"
          check_dir  "src/core/importers"
          check_file "src/core/importers/__init__.py"
          check_optional "src/core/importers/data_importer.py"
          check_optional "src/core/importers/m1_importer.py"
          check_optional "src/core/importers/m2_m5_importer.py"
          check_optional "src/core/importers/special_checker.py"

          echo "──── rules ────"
          check_dir  "src/rules"
          check_file "src/rules/__init__.py"
          for sub in m1 m2 m3 m4 m5 special; do
            if [ -d "src/rules/$sub" ]; then
              echo "✅ src/rules/$sub/"
              check_file "src/rules/$sub/__init__.py"
            else
              echo "⚠️  (اختیاری) src/rules/$sub/ هنوز ساخته نشده"
            fi
          done

          echo "──── scripts ────"
          check_file "scripts/download_nltk.py"

          echo "──── ورودی ────"
          if [ ! -d "data/input" ] || [ -z "$(ls -A data/input/*.txt 2>/dev/null)" ]; then
            echo "❌ هیچ فایل متنی در data/input/ وجود ندارد!"
            errors=$((errors+1))
          else
            echo "✅ فایل‌های ورودی موجودند:"
            ls -la data/input/
          fi

          echo ""
          if [ $errors -gt 0 ]; then
            echo "❌ $errors خطا در ساختار پروژه."
            exit 1
          fi
          echo "✅ ساختار پروژه معتبر است."

      # ============================================================
      # 🔍 Sanity check: import پکیج‌های حیاتی
      # ============================================================
      - name: 🔍 بررسی import پکیج‌ها (sanity check)
        env:
          PYTHONPATH: .
        run: |
          echo "──── utils و token ────"
          python -c "from src.utils import number_type, is_np_boundary; print('✅ utils OK')"
          python -c "from src.ht_token import Token; print('✅ token OK')"

          echo "──── core ────"
          python -c "from src.core.context import Context; print('✅ context OK')"
          python -c "from src.core.rule_base import Rule, RuleRegistry; print('✅ rule_base OK')"
          python -c "from src.core.processor import Processor; print('✅ processor OK')"

          echo "──── importers (اختیاری در فاز اسکلت) ────"
          python -c "
          try:
              from src.core.importers import build_context, import_m1_rules, import_m2_to_m5, import_special_rules
              print('✅ importers OK')
          except (ImportError, AttributeError) as e:
              print(f'⚠️  importers هنوز کامل نیست: {e}')
          "

          echo "──── pipeline (اختیاری در فاز اسکلت) ────"
          python -c "
          try:
              from src.core.pipeline import Pipeline
              print('✅ pipeline OK')
          except (ImportError, AttributeError) as e:
              print(f'⚠️  pipeline هنوز کامل نیست: {e}')
          "

      # ============================================================
      # 🔍 بررسی استایل با flake8 (فقط هشدار)
      # ============================================================
      - name: 🔍 بررسی استایل با flake8
        run: |
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      # ============================================================
      # 🧪 تست‌ها — تفکیک‌شده بر اساس زیرپوشه
      # ============================================================
      - name: 🧪 تست‌های Core
        env:
          PYTHONPATH: .
        run: |
          if [ -d "tests/test_core" ] && [ "$(ls -A tests/test_core/*.py 2>/dev/null)" ]; then
            pytest tests/test_core/ -v
          else
            echo "⚠️ تست‌های test_core یافت نشد، رد می‌شود."
          fi
        continue-on-error: true

      - name: 🧪 تست‌های Importers
        env:
          PYTHONPATH: .
        run: |
          if [ -d "tests/test_importers" ] && [ "$(ls -A tests/test_importers/*.py 2>/dev/null)" ]; then
            pytest tests/test_importers/ -v
          else
            echo "⚠️ تست‌های test_importers یافت نشد، رد می‌شود."
          fi
        continue-on-error: true

      - name: 🧪 تست‌های Rules
        env:
          PYTHONPATH: .
        run: |
          if [ -d "tests/test_rules" ] && [ "$(ls -A tests/test_rules/*.py 2>/dev/null)" ]; then
            pytest tests/test_rules/ -v
          else
            echo "⚠️ تست‌های test_rules یافت نشد، رد می‌شود."
          fi
        continue-on-error: true

      - name: 🧪 تست‌های عمومی (tests/*.py)
        env:
          PYTHONPATH: .
        run: |
          if ls tests/*.py 1> /dev/null 2>&1; then
            pytest tests/*.py -v
          else
            echo "⚠️ تست عمومی یافت نشد."
          fi
        continue-on-error: true

      # ============================================================
      # 🏃 پردازش همه‌ی فایل‌های input
      # ============================================================
      - name: 🏃 پردازش همه‌ی فایل‌های data/input/
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data/output

          found_any=false
          for input_file in data/input/*.txt; do
            if [ -f "$input_file" ]; then
              found_any=true
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📄 در حال پردازش: $input_file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

              python src/main.py "$input_file"

              base=$(basename "$input_file" .txt)
              if [ -f "data/output/output.xlsx" ]; then
                mv data/output/output.xlsx "data/output/output_${base}.xlsx"
                echo "✅ خروجی اکسل: output_${base}.xlsx"
              fi
              if [ -f "data/output/output.txt" ]; then
                mv data/output/output.txt "data/output/output_${base}.txt"
                echo "✅ خروجی متنی: output_${base}.txt"
              fi
            fi
          done

          if [ "$found_any" = false ]; then
            echo "❌ هیچ فایل متنی‌ای پیدا نشد!"
            exit 1
          fi

          if ls data/output/output_* 1> /dev/null 2>&1; then
            echo ""
            echo "✅ همه‌ی فایل‌ها با موفقیت پردازش شدند."
            ls -la data/output/
          else
            echo "❌ هیچ خروجی‌ای ساخته نشد!"
            exit 1
          fi

      # ============================================================
      # 🗑️ حذف آرتیفکت‌های قبلی پایتون
      # ============================================================
      - name: 🗑️ حذف آرتیفکت‌های قبلی پایتون
        if: matrix.python-version == '3.10'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'output-python';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === artifactName) {
                console.log(`🗑️ حذف: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: 📤 آپلود خروجی پایتون (فقط Python 3.10)
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: output-python
          path: |
            data/output/output_*
          retention-days: 7
          if-no-files-found: warn

  # ============================================================
  # Job داکر — بدون تغییر اساسی
  # ============================================================
  docker-test:
    name: تست داکر
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: ساخت ایمیج
        run: docker build -f docker/Dockerfile -t text-processor .

      - name: 🏃 پردازش همه‌ی فایل‌های input با داکر
        run: |
          mkdir -p data/output

          found_any=false
          for input_file in data/input/*.txt; do
            if [ -f "$input_file" ]; then
              found_any=true
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🐳 داکر در حال پردازش: $input_file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

              docker run --rm \
                -v "$(pwd)/data:/app/data" \
                -v "$(pwd)/Book1.xlsx:/app/Book1.xlsx" \
                text-processor "$input_file"

              base=$(basename "$input_file" .txt)
              if [ -f "data/output/output.xlsx" ]; then
                mv data/output/output.xlsx "data/output/docker_output_${base}.xlsx"
              fi
              if [ -f "data/output/output.txt" ]; then
                mv data/output/output.txt "data/output/docker_output_${base}.txt"
              fi
            fi
          done

          if [ "$found_any" = false ]; then
            echo "❌ هیچ فایل متنی‌ای پیدا نشد!"
            exit 1
          fi

          if ls data/output/docker_output_* 1> /dev/null 2>&1; then
            echo "✅ داکر همه‌ی فایل‌ها رو پردازش کرد."
            ls -la data/output/
          else
            echo "❌ هیچ خروجی‌ای از داکر نیامد!"
            exit 1
          fi

      - name: 🗑️ حذف آرتیفکت‌های قبلی داکر
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'output-docker';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === artifactName) {
                console.log(`🗑️ حذف: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: 📤 آپلود خروجی داکر
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-docker
          path: |
            data/output/docker_output_*
          retention-days: 7
          if-no-files-found: warn
