name: CI - تست و بررسی

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'data/input/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/input/**'

jobs:
  test:
    name: تست روی Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]
    
    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4

      - name: 🐍 نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || echo "⚠️ requirements-dev.txt موجود نیست"

      - name: 📥 دانلود دیتاهای NLTK
        run: |
          python -m nltk.downloader punkt wordnet cmudict

      - name: 🔍 بررسی وجود فایل‌های ضروری
        run: |
          if [ ! -f "Book1.xlsx" ]; then
            echo "❌ Book1.xlsx وجود ندارد!"
            exit 1
          fi
          if [ ! -f "src/__init__.py" ]; then
            echo "❌ src/__init__.py وجود ندارد!"
            exit 1
          fi
          if [ ! -d "data/input" ] || [ -z "$(ls -A data/input/*.txt 2>/dev/null)" ]; then
            echo "❌ هیچ فایل متنی در data/input/ وجود ندارد!"
            exit 1
          fi

      - name: 🔍 بررسی استایل با flake8 (فقط هشدار، بدون شکست)
        run: |
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: 🧪 اجرای تست‌های واحد (در صورت وجود)
        env:
          PYTHONPATH: .
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v
          else
            echo "⚠️ تست‌های واحدی یافت نشد، رد می‌شود."
          fi
        continue-on-error: true

      # ============================================================
      # 🏃 پردازش همه‌ی فایل‌های input
      # ============================================================
      - name: 🏃 پردازش همه‌ی فایل‌های data/input/
        env:
          PYTHONPATH: .
        run: |
          mkdir -p data/output
          
          # پردازش هر فایل .txt در data/input
          found_any=false
          for input_file in data/input/*.txt; do
            if [ -f "$input_file" ]; then
              found_any=true
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📄 در حال پردازش: $input_file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              python src/main.py "$input_file"
              
              # نام‌گذاری خروجی بر اساس نام فایل ورودی
              base=$(basename "$input_file" .txt)
              if [ -f "data/output/output.xlsx" ]; then
                mv data/output/output.xlsx "data/output/output_${base}.xlsx"
                echo "✅ خروجی اکسل: output_${base}.xlsx"
              fi
              if [ -f "data/output/output.txt" ]; then
                mv data/output/output.txt "data/output/output_${base}.txt"
                echo "✅ خروجی متنی: output_${base}.txt"
              fi
            fi
          done
          
          if [ "$found_any" = false ]; then
            echo "❌ هیچ فایل متنی‌ای پیدا نشد!"
            exit 1
          fi
          
          # بررسی نهایی
          if ls data/output/output_* 1> /dev/null 2>&1; then
            echo ""
            echo "✅ همه‌ی فایل‌ها با موفقیت پردازش شدند."
            ls -la data/output/
          else
            echo "❌ هیچ خروجی‌ای ساخته نشد!"
            exit 1
          fi

      # ============================================================
      # 🗑️ حذف آرتیفکت‌های قبلی output-python
      # ============================================================
      - name: 🗑️ حذف آرتیفکت‌های قبلی پایتون
        if: matrix.python-version == '3.10'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'output-python';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === artifactName) {
                console.log(`🗑️ حذف: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: 📤 آپلود خروجی پایتون (فقط Python 3.10)
        if: always() && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: output-python
          path: |
            data/output/output_*
          retention-days: 7
          if-no-files-found: warn

  # ============================================================
  # Job داکر
  # ============================================================
  docker-test:
    name: تست داکر
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4
      
      - name: ساخت ایمیج
        run: docker build -f docker/Dockerfile -t text-processor .
      
      - name: 🏃 پردازش همه‌ی فایل‌های input با داکر
        run: |
          mkdir -p data/output
          
          found_any=false
          for input_file in data/input/*.txt; do
            if [ -f "$input_file" ]; then
              found_any=true
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🐳 داکر در حال پردازش: $input_file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              docker run --rm \
                -v "$(pwd)/data:/app/data" \
                -v "$(pwd)/Book1.xlsx:/app/Book1.xlsx" \
                text-processor "$input_file"
              
              base=$(basename "$input_file" .txt)
              if [ -f "data/output/output.xlsx" ]; then
                mv data/output/output.xlsx "data/output/docker_output_${base}.xlsx"
              fi
              if [ -f "data/output/output.txt" ]; then
                mv data/output/output.txt "data/output/docker_output_${base}.txt"
              fi
            fi
          done
          
          if [ "$found_any" = false ]; then
            echo "❌ هیچ فایل متنی‌ای پیدا نشد!"
            exit 1
          fi
          
          if ls data/output/docker_output_* 1> /dev/null 2>&1; then
            echo "✅ داکر همه‌ی فایل‌ها رو پردازش کرد."
            ls -la data/output/
          else
            echo "❌ هیچ خروجی‌ای از داکر نیامد!"
            exit 1
          fi

      - name: 🗑️ حذف آرتیفکت‌های قبلی داکر
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'output-docker';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === artifactName) {
                console.log(`🗑️ حذف: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      - name: 📤 آپلود خروجی داکر
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-docker
          path: |
            data/output/docker_output_*
          retention-days: 7
          if-no-files-found: warn
